<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <link rel="icon" type="image/svg+xml" href="/icon.svg" />
  <link rel="icon" type="image/png" sizes="192x192" href="/pwa-192x192.png" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="FocusFlow" />
  <title>FocusFlow — Personal Productivity</title>
  <style>
    html, body {
      background: #000000;
      margin: 0;
      padding: 0;
      min-height: 100%;
      overscroll-behavior-y: contain;
      -webkit-overflow-scrolling: touch;
    }
    #root {
      min-height: 100%;
      background: #000000;
    }
    #initial-splash {
      position: fixed; inset: 0; background: #000000;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 18px; z-index: 999;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    #initial-splash .mark {
      width: 64px; height: 64px; border-radius: 18px;
      background: linear-gradient(135deg, #2563EB 0%, #6366F1 50%, #9333EA 100%);
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 20px 60px -12px rgba(99, 102, 241, 0.6);
      animation: initial-pulse 1.6s ease-in-out infinite;
    }
    #initial-splash .name {
      font-size: 24px; font-weight: 700;
      background: linear-gradient(90deg, #60A5FA 0%, #A5B4FC 50%, #C084FC 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      letter-spacing: -0.01em;
    }
    #initial-splash .sub { font-size: 12.5px; color: #9A99AC; margin-top: -8px; }
    #initial-splash .bar-track {
      width: 140px; height: 3px; background: rgba(255, 255, 255, 0.1);
      border-radius: 999px; overflow: hidden; margin-top: 4px;
    }
    #initial-splash .bar-fill {
      width: 100%; height: 100%;
      background: linear-gradient(90deg, transparent 0%, #3B82F6 30%, #818CF8 60%, #C084FC 90%, transparent 100%);
      border-radius: 999px;
      animation: initial-shimmer 1.5s ease-in-out infinite;
    }
    @keyframes initial-pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.08); opacity: 0.85; }
    }
    @keyframes initial-shimmer {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(100%); }
    }
  </style>
</head>
<body>
  <div id="root">
    <div id="initial-splash">
      <div class="mark">
        <svg width="34" height="34" viewBox="0 0 24 24" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="1">
          <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2" />
        </svg>
      </div>
      <div class="name">FocusFlow</div>
      <div class="sub">Loading your day…</div>
      <div class="bar-track"><div class="bar-fill"></div></div>
    </div>
  </div>

  <script src="/app.js"></script>

  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("/sw.js").catch((err) => {
          console.warn("Service worker registration failed:", err);
        });
      });
    }
  </script>
</body>
</html>
