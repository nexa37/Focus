<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="ff-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#9333EA" />
    </linearGradient>
    <radialGradient id="bg-glow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#4F46E5" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#02040A" stop-opacity="0" />
    </radialGradient>
    <filter id="drop-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>
  
  <!-- Base dark canvas -->
  <rect width="512" height="512" fill="#02040A" />
  <circle cx="256" cy="256" r="240" fill="url(#bg-glow)" />
  
  <!-- FocusFlow Brand Badge -->
  <g filter="url(#drop-shadow)">
    <rect x="80" y="80" width="352" height="352" rx="88" fill="url(#ff-grad)" />
    <rect x="80" y="80" width="352" height="352" rx="88" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="2" />
  </g>
  
  <!-- FocusFlow Zap / Lightning Mark -->
  <g transform="translate(256, 256) scale(11) translate(-12, -12)">
    <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="0.5" stroke-linejoin="round" />
  </g>
</svg>