<!doctype html>
<html lang="en" style="background-color: #000000; margin: 0; padding: 0;">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="FocusFlow" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:ital,wght@0,300..800;1,300..800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <title>FocusFlow - Focus Better. Achieve More.</title>
    <meta name="description" content="Turn your goals into focused actions, build better habits, and achieve more with FocusFlow." />
    <meta property="og:title" content="FocusFlow - Focus Better. Achieve More." />
    <meta property="og:description" content="Turn your goals into focused actions, build better habits, and achieve more with FocusFlow." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <style>
      html, body, #root {
        background-color: #000000;
        margin: 0;
        padding: 0;
        min-height: 100%;
        color: #ffffff;
      }
      #initial-app-splash {
        position: fixed;
        inset: 0;
        background: #000000;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 99999;
        will-change: opacity, transform;
      }
      .ff-splash-box {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        text-align: center;
      }
      .ff-splash-mark {
        width: 64px;
        height: 64px;
        border-radius: 18px;
        background: linear-gradient(135deg, #2563EB 0%, #6366F1 50%, #9333EA 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 20px 60px -12px rgba(99, 102, 241, 0.6);
        animation: ff-pulse 1.8s ease-in-out infinite;
      }
      .ff-splash-title {
        font-family: 'Fraunces', Georgia, serif;
        font-size: 24px;
        font-weight: 700;
        background: linear-gradient(90deg, #60A5FA 0%, #A5B4FC 50%, #C084FC 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        letter-spacing: -0.01em;
      }
      .ff-splash-sub {
        font-family: 'Inter', -apple-system, sans-serif;
        font-size: 12.5px;
        color: #9A99AC;
        margin-top: 6px;
      }
      .ff-splash-bar-track {
        width: 140px;
        height: 3px;
        background: rgba(255, 255, 255, 0.1);
        border-radius: 999px;
        overflow: hidden;
        margin-top: 8px;
      }
      .ff-splash-bar-fill {
        width: 100%;
        height: 100%;
        background: linear-gradient(90deg, transparent 0%, #3B82F6 30%, #818CF8 60%, #C084FC 90%, transparent 100%);
        border-radius: 999px;
        animation: ff-shimmer 1.5s ease-in-out infinite;
      }
      @keyframes ff-pulse {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(1.06); opacity: 0.92; }
      }
      @keyframes ff-shimmer {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(100%); }
      }
    </style>
    <script>
      window.__splashStartTime = Date.now();
      try {
        var params = new URLSearchParams(window.location.search);
        var isPwa = params.get('source') === 'pwa' || params.get('standalone') === 'true';
        var isStandalone = (window.matchMedia && (
          window.matchMedia('(display-mode: standalone)').matches ||
          window.matchMedia('(display-mode: fullscreen)').matches ||
          window.matchMedia('(display-mode: minimal-ui)').matches
        )) || window.navigator.standalone === true;
        var pathname = window.location.pathname;
        var isAppRoute = isPwa || isStandalone || pathname === '/dashboard' || pathname === '/app';
        window.__isAppLaunch = isAppRoute;
      } catch (e) {
        window.__isAppLaunch = false;
      }
    </script>
  </head>
  <body style="background-color: #000000; margin: 0; padding: 0; min-height: 100%; overscroll-behavior-y: contain; -webkit-overflow-scrolling: touch;">
    <!-- Seamless Initial Splash: Prevents blank screen between OS launch and React app mount -->
    <div id="initial-app-splash" aria-hidden="true">
      <div class="ff-splash-box">
        <div class="ff-splash-mark">
          <svg width="34" height="34" viewBox="0 0 24 24" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="1">
            <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
          </svg>
        </div>
        <div class="ff-splash-text">
          <div class="ff-splash-title">FocusFlow</div>
          <div class="ff-splash-sub">Loading your day…</div>
        </div>
        <div class="ff-splash-bar-track">
          <div class="ff-splash-bar-fill"></div>
        </div>
      </div>
    </div>
    <script>
      if (!window.__isAppLaunch) {
        var sp = document.getElementById('initial-app-splash');
        if (sp) sp.style.display = 'none';
      }
    </script>
    <div id="root" style="background-color: #000000; min-height: 100%;"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
